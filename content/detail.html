<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">News - Digisino Electronics</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/css/style.css">
    <!-- 引入 Markdown 解析库，用于把后台排版渲染成网页 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .page-header {
            background: linear-gradient(rgba(0, 111, 66, 0.6), rgba(0, 111, 66, 0.75)), url('/webp-images/general/news-bg.webp');
            background-size: cover; 
            background-position: center; 
            color: var(--white); 
            padding: 100px 0 60px; 
            text-align: center;
        }
        .news-section { padding: 80px 0; }
        .news-container { max-width: 900px; margin: 0 auto; }
        .news-item { background: var(--white); border-radius: 10px; padding: 40px; box-shadow: 0 5px 20px rgba(0,0,0,0.05); }
        .news-date { color: var(--primary-color); font-weight: 600; margin-bottom: 15px; }
        .news-title { font-size: 1.8rem; margin-bottom: 20px; color: var(--primary-dark); line-height: 1.3; }
        .news-content { font-size: 1.1rem; line-height: 1.8; margin-bottom: 25px; color: #333; }
        .news-content img { max-width: 100%; height: auto; border-radius: 8px; display: block; margin: 20px auto; }
        
        /* 上一篇 / 下一篇快捷导航样式 */
        .news-nav-links {
            display: flex;
            justify-content: space-between;
            margin-top: 40px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .news-nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--primary-color);
            font-weight: 600;
            text-decoration: none;
            transition: color 0.3s;
        }
        .news-nav-btn:hover { color: var(--primary-dark); }
    </style>
</head>
<body>
    <!-- 页眉区域 -->
    <header class="main-header">
        <div class="container">
            <div class="header-content">
                <a href="/" class="logo">
                    <img src="/webp-images/general/logo.webp" alt="Digisino Electronics Logo">
                </a>
                <nav class="main-nav">
                    <ul>
                        <li><a href="/">Home</a></li>
                        <li><a href="/about.html">About Us</a></li>
                        <li><a href="/products.html">Products</a></li>
                        <li><a href="/services.html">Services</a></li>
                        <li><a href="/news.html" class="active">News</a></li>
                        <li><a href="/contact.html">Contact Us</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1 id="headerTitle">News Details</h1>
        </div>
    </section>

    <section class="news-section">
        <div class="container">
            <div class="news-container">
                <div class="news-item">
                    <div class="news-date" id="newsDate"></div>
                    <h2 class="news-title" id="articleTitle"></h2>
                    <div class="news-content" id="articleBody">Loading content...</div>

                    <!-- 自动生成：上一篇 / 下一篇 按钮 -->
                    <div class="news-nav-links" id="postNav">
                        <a id="prevPost" class="news-nav-btn" href="#" style="display:none;"><i class="fas fa-arrow-left"></i> Previous Article</a>
                        <a id="nextPost" class="news-nav-btn" href="#" style="display:none;">Next Article <i class="fas fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 页脚区域 -->
    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; Digisino Electronics Limited. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <script src="/js/main.js" defer></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');

        if (!postId) {
            document.getElementById('articleBody').innerText = 'Article not found.';
        } else {
            fetch('/content/news-index.json')
                .then(res => res.json())
                .then(posts => {
                    // 按日期降序排列（最新的在前面）
                    posts.sort((a, b) => new Date(b.date) - new Date(a.date));
                    
                    const currentIndex = posts.findIndex(p => p.id === postId);
                    if (currentIndex !== -1) {
                        const currentPost = posts[currentIndex];
                        document.title = currentPost.title + " - Digisino Electronics";
                        document.getElementById('articleTitle').innerText = currentPost.title;
                        document.getElementById('headerTitle').innerText = currentPost.title;
                        document.getElementById('newsDate').innerText = currentPost.displayDate;

                        // 读取对应 Markdown 文件正文
                        fetch(`/content/news/${postId}.md`)
                            .then(r => {
                                if (!r.ok) throw new Error("File not found");
                                return r.text();
                            })
                            .then(mdText => {
                                // 过滤头部配置参数，只提取正文内容
                                const bodyText = mdText.replace(/^---[\s\S]*?---/, '');
                                document.getElementById('articleBody').innerHTML = marked.parse(bodyText);
                            })
                            .catch(err => {
                                document.getElementById('articleBody').innerText = 'Content is loading or temporarily unavailable.';
                            });

                        // 自动计算并显示“上一篇 / 下一篇”链接
                        if (currentIndex < posts.length - 1) {
                            const prev = posts[currentIndex + 1];
                            const prevBtn = document.getElementById('prevPost');
                            prevBtn.href = `/news/detail.html?id=${prev.id}`;
                            prevBtn.title = prev.title;
                            prevBtn.style.display = 'inline-flex';
                        }
                        if (currentIndex > 0) {
                            const next = posts[currentIndex - 1];
                            const nextBtn = document.getElementById('nextPost');
                            nextBtn.href = `/news/detail.html?id=${next.id}`;
                            nextBtn.title = next.title;
                            nextBtn.style.display = 'inline-flex';
                        }
                    } else {
                        document.getElementById('articleBody').innerText = 'Article not found.';
                    }
                })
                .catch(err => {
                    document.getElementById('articleBody').innerText = 'Failed to load article index.';
                });
        }
    </script>
</body>
</html>
