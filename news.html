<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News & Updates - Digisino Electronics Limited</title>
  
  <!-- 绝对路径引入网站统一的主样式表 -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/news.css">
</head>
<body>

  <!-- 动态加载统一页眉 -->
  <div id="header-placeholder"></div>

  <!-- Banner 区域 -->
  <section class="page-banner">
    <div class="container">
      <h1>News & Updates</h1>
    </div>
  </section>

  <!-- 新闻列表区域 -->
  <section class="news-section">
    <div class="container">
      <div id="newsList" class="news-list">
        <!-- 动态加载新闻内容 -->
      </div>
    </div>
  </section>

  <!-- 动态加载统一页脚 -->
  <div id="footer-placeholder"></div>

  <!-- 页眉页脚组件加载脚本 -->
  <script src="/js/main.js"></script>

  <script>
    async function loadNews() {
      try {
        const response = await fetch('/content/news-index.json');
        if (!response.ok) throw new Error('Failed to load news index');
        const newsList = await response.json();

        const container = document.getElementById('newsList');
        if (!container) return;

        container.innerHTML = '';

        newsList.forEach((item, index) => {
          // 注意：此处修改跳转链接为根目录下的 /detail.html（或 /news-detail.html）
          const detailUrl = `/detail.html?id=${item.id}`;
          
          const itemHtml = `
            <div class="news-item" onclick="location.href='${detailUrl}'" style="cursor: pointer;">
              <div class="news-number">${index + 1}.</div>
              <div class="news-date">${item.displayDate || item.date}</div>
              <div class="news-title-container">
                <h3 class="news-title">${item.title}</h3>
              </div>
              <a href="${detailUrl}" class="read-more">READ FULL STORY &rarr;</a>
            </div>
          `;
          container.insertAdjacentHTML('beforeend', itemHtml);
        });
      } catch (error) {
        console.error('Error loading news:', error);
      }
    }

    document.addEventListener('DOMContentLoaded', loadNews);
  </script>
</body>
</html>
