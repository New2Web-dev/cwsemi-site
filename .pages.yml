media: webp-images/content
content:
  - name: news
    label: News Management
    path: content/news
    type: collection
    fields:
      - name: title
        label: News Title
        type: string
        required: true
      - name: date
        label: Publish Date
        type: date
        required: true
      - name: image
        label: Featured Image
        type: image
        required: false
      - name: body
        label: News Content
        type: rich-text
        required: true
